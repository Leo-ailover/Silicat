<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Silicat</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<header>
  <h1>Silicat</h1>
  <div id="status" class="status">connecting…</div>
  <button id="new-chat-btn" class="new-chat-btn" aria-label="Start a new chat">+ New chat</button>
</header>

<main>
  <section id="chat" class="chat" aria-live="polite" aria-label="Chat history"></section>

  <form id="composer" class="composer" aria-label="Chat composer">
    <textarea
      id="input"
      rows="2"
      placeholder="Ask Silicat to write some code…"
      aria-label="Message prompt"
      autofocus
    ></textarea>
    <button id="send" type="submit" aria-label="Send message" disabled>Send</button>
  </form>
</main>

<aside id="controls" class="controls">
  <details>
    <summary>Sampling</summary>
    <label>temperature <input id="temperature" type="number" step="0.05" min="0.05" max="2" value="0.9" /></label>
    <label>top_k <input id="top_k" type="number" step="1" min="0" max="500" value="40" /></label>
    <label>top_p <input id="top_p" type="number" step="0.05" min="0" max="1" value="0.95" /></label>
    <label>max_new_tokens <input id="max_new_tokens" type="number" step="16" min="16" max="1024" value="256" /></label>
  </details>
</aside>

<script src="/static/app.js"></script>
</body>
</html>
